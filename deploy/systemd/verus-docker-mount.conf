# Install at /etc/systemd/system/docker.service.d/verus-data.conf.
# This affects the entire Docker daemon and is for a DEDICATED Verus host only.
[Unit]
RequiresMountsFor=/srv/verus-data
BindsTo=srv-verus\x2ddata.mount
After=srv-verus\x2ddata.mount

[Service]
ExecStartPre=/usr/local/sbin/verus-require-data-disk
