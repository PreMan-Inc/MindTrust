name: Check MindTrust
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/contracts/requirements.txt
      - run: python -m pip install -r tests/contracts/requirements.txt
      - name: Verify official Python SDK compatibility
        run: python -m unittest discover -s tests/contracts -p '*_test.py' -v
      - name: Verify public-agent scorers without model calls
        run: python -m unittest discover -s examples/agents/public -p 'test_scorers.py' -v
      - name: Validate isolated deployment configuration
        env:
          DOMAIN: ci.example.test
          ACME_EMAIL: ci@example.test
          MINDTRUST_ADMIN_TOKEN: synthetic-configuration-validation-only-2026
        run: |
          docker compose -f deploy/compose.production.yaml config --quiet
          docker compose -f deploy/compose.production.yaml -f deploy/compose.lightsail.yaml config --quiet
          bash -n deploy/verus-require-data-disk.sh deploy/verus-backup.sh
          docker run --rm -e DOMAIN -e ACME_EMAIL -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.11.7-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - run: docker build -t mindtrust:ci .
      - name: Verify isolated production container
        run: |
          token="$(openssl rand -hex 32)"
          docker run -d --name mindtrust-ci -p 127.0.0.1:4310:4310 -e MINDTRUST_ADMIN_TOKEN="$token" -e MINDTRUST_ALLOWED_ORIGINS=https://ci.example.test mindtrust:ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4310/readyz; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4310/readyz
          test "$(curl --silent -o /dev/null -w '%{http_code}' http://127.0.0.1:4310/api/projects)" = 401
          curl --fail --silent -H "Authorization: Bearer $token" http://127.0.0.1:4310/api/projects
          docker stop --time 50 mindtrust-ci
          test "$(docker inspect -f '{{.State.ExitCode}}' mindtrust-ci)" = 0
